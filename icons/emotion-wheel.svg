<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
<title>Emotion wheel</title>
<!-- Circular emotion wheel: 8 emotions on the rim, Neutral in the centre, handle dot distance = intensity. Order clockwise from top matches Emotion::all(): Shouting, Angry, Happy, Laughing, Bored, Scared, Sad, Coy. -->
<circle cx="24" cy="24" r="21" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<circle cx="24" cy="24" r="15.5" fill="none" stroke="#D1D5DB" stroke-width="1"/>
<!-- Shouting, top -->
<g><circle cx="24" cy="8.5" r="5.5" fill="#EF4444" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="22.2" cy="7.3" r="0.8" fill="#1A1A1A"/><circle cx="25.8" cy="7.3" r="0.8" fill="#1A1A1A"/><circle cx="24" cy="10.3" r="1.7" fill="#1A1A1A"/></g>
<!-- Angry, top-right -->
<g><circle cx="35" cy="13" r="5.5" fill="#DC2626" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="33.2" cy="11.8" r="0.8" fill="#1A1A1A"/><circle cx="36.8" cy="11.8" r="0.8" fill="#1A1A1A"/><path d="M 32 9.5 L 34 11 M 38 9.5 L 36 11" stroke="#1A1A1A" stroke-width="1" fill="none"/><path d="M 33.5 15.8 Q 35 14.2 36.5 15.8" stroke="#1A1A1A" stroke-width="1" fill="none"/></g>
<!-- Happy, right -->
<g><circle cx="39.5" cy="24" r="5.5" fill="#FACC15" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="37.7" cy="22.8" r="0.8" fill="#1A1A1A"/><circle cx="41.3" cy="22.8" r="0.8" fill="#1A1A1A"/><path d="M 37.5 25.5 Q 39.5 27.5 41.5 25.5" stroke="#1A1A1A" stroke-width="1" fill="none"/></g>
<!-- Laughing, bottom-right -->
<g><circle cx="35" cy="35" r="5.5" fill="#FB923C" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="33.2" cy="33.8" r="0.8" fill="#1A1A1A"/><circle cx="36.8" cy="33.8" r="0.8" fill="#1A1A1A"/><path d="M 33.5 36.8 A 1.8 1.8 0 0 0 36.5 36.8 Z" fill="#1A1A1A"/></g>
<!-- Bored, bottom -->
<g><circle cx="24" cy="39.5" r="5.5" fill="#9CA3AF" stroke="#1A1A1A" stroke-width="1.5"/><path d="M 22.2 38.3 H 23.8 M 24.2 38.3 H 25.8" stroke="#1A1A1A" stroke-width="1"/><path d="M 22.5 41.5 H 25.5" stroke="#1A1A1A" stroke-width="1"/></g>
<!-- Scared, bottom-left -->
<g><circle cx="13" cy="35" r="5.5" fill="#A78BFA" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="11.2" cy="33.8" r="1.1" fill="#1A1A1A"/><circle cx="14.8" cy="33.8" r="1.1" fill="#1A1A1A"/><circle cx="13" cy="37" r="1.5" fill="#1A1A1A"/></g>
<!-- Sad, left -->
<g><circle cx="8.5" cy="24" r="5.5" fill="#60A5FA" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="6.7" cy="22.8" r="0.8" fill="#1A1A1A"/><circle cx="10.3" cy="22.8" r="0.8" fill="#1A1A1A"/><path d="M 6.8 26.5 Q 8.5 25 10.2 26.5" stroke="#1A1A1A" stroke-width="1" fill="none"/></g>
<!-- Coy, top-left -->
<g><circle cx="13" cy="13" r="5.5" fill="#F9A8D4" stroke="#1A1A1A" stroke-width="1.5"/><path d="M 10.5 11.8 Q 11.5 10.8 12.5 11.8" stroke="#1A1A1A" stroke-width="1" fill="none"/><circle cx="14.8" cy="11.8" r="0.8" fill="#1A1A1A"/><path d="M 11.5 14.5 Q 13 15.5 14.5 14.5" stroke="#1A1A1A" stroke-width="1" fill="none"/></g>
<!-- Neutral, centre -->
<g><circle cx="24" cy="24" r="7" fill="#E5E7EB" stroke="#1A1A1A" stroke-width="1.5"/><circle cx="22" cy="22.5" r="0.9" fill="#1A1A1A"/><circle cx="26" cy="22.5" r="0.9" fill="#1A1A1A"/><path d="M 22 26 H 26" stroke="#1A1A1A" stroke-width="1"/></g>
<!-- Intensity handle: dot toward Happy, distance from centre = strength -->
<line x1="24" y1="24" x2="33" y2="24" stroke="#1A1A1A" stroke-width="1.5"/>
<circle cx="33" cy="24" r="2.5" fill="#1A1A1A"/>
</svg>

